<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritma Care Link - Layanan Kesehatan Mahasantri</title>

    <script>
        window.tailwind = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: { 'xs': '380px' },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        };
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Times+New+Roman&display=swap" rel="stylesheet">

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            overflow-x: hidden;
            touch-action: manipulation;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-scrollbar { -webkit-overflow-scrolling: touch; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .chart-container {
            position: relative;
            width: 100%;
            height: 220px;
            max-height: 260px;
        }
        @media (min-width: 640px) {
            .chart-container { height: 260px; }
        }

        input, select, textarea {
            font-size: 16px !important;
        }
        @media (min-width: 640px) {
            input, select, textarea {
                font-size: 0.875rem !important;
            }
        }

        .font-official {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-500 selection:text-white dark:bg-slate-900 dark:text-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // =========================================================================
        // MASUKKAN URL GOOGLE APPS SCRIPT WEB APP ANDA DI BAWAH INI:
        // =========================================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNUOHkmlniRORE_7_yP9YZnVnHwhGclGfQzJnUfORsO0g7VsZ6K02PbA3-BJGcQEiH/exec";

        const getSectorByBuilding = (buildingName) => {
            if (buildingName === "Gedung C") return "Putri";
            return "Putra";
        };

        // SEMUA DATA AWAL DIKOSONGKAN AGAR MURNI MENGGUNAKAN GOOGLE SHEETS
        const INITIAL_ROOMS = [];
        const INITIAL_SEBAT = [];
        const INITIAL_STAFF = [];
        const INITIAL_REQUESTS = [];

        function App() {
            const [currentView, setCurrentView] = useState("dashboard");
            const [userRole, setUserRole] = useState(null);
            const [currentMahasantri, setCurrentMahasantri] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem('ritma_dark_mode');
                return saved ? JSON.parse(saved) : false;
            });
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const [rooms, setRooms] = useState(() => {
                const saved = localStorage.getItem('ritma_rooms_26_27');
                return saved ? JSON.parse(saved) : INITIAL_ROOMS;
            });

            const [medicines, setMedicines] = useState(() => {
                const saved = localStorage.getItem('ritma_medicines_26_27');
                return saved ? JSON.parse(saved) : INITIAL_SEBAT;
            });

            const [staff, setStaff] = useState(() => {
                const saved = localStorage.getItem('ritma_staff_26_27');
                return saved ? JSON.parse(saved) : INITIAL_STAFF;
            });

            const [requests, setRequests] = useState(() => {
                const saved = localStorage.getItem('ritma_requests_26_27');
                return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
            });

            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            useEffect(() => {
                localStorage.setItem('ritma_rooms_26_27', JSON.stringify(rooms));
            }, [rooms]);

            useEffect(() => {
                localStorage.setItem('ritma_medicines_26_27', JSON.stringify(medicines));
            }, [medicines]);

            useEffect(() => {
                localStorage.setItem('ritma_staff_26_27', JSON.stringify(staff));
            }, [staff]);

            useEffect(() => {
                localStorage.setItem('ritma_requests_26_27', JSON.stringify(requests));
            }, [requests]);

            useEffect(() => {
                localStorage.setItem('ritma_dark_mode', JSON.stringify(isDarkMode));
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const postToSheets = (payload) => {
                if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_SCRIPT_ID_HERE")) return;
                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(err => console.log("Background sync error:", err));
            };

            const toggleDarkMode = () => {
                setIsDarkMode(prev => {
                    const nextMode = !prev;
                    if (nextMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    localStorage.setItem('ritma_dark_mode', JSON.stringify(nextMode));
                    return nextMode;
                });
                showToast(`Mode ${!isDarkMode ? 'Gelap' : 'Terang'} Diaktifkan`, "info");
            };

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const syncWithGoogleSheets = async () => {
                if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_SCRIPT_ID_HERE")) {
                    showToast("URL Google Apps Script belum diisi di index.html", "info");
                    return;
                }

                setIsSyncing(true);
                showToast("Menyinkronkan data dengan Google Sheets...", "info");

                try {
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllData`, { method: "GET", mode: "cors" });
                    const result = await response.json();
                    if (result && result.status === "success" && result.data) {
                        // 1. Sync Mahasantri & Kamar
                        if (result.data.mahasantri && Array.isArray(result.data.mahasantri)) {
                            const roomMap = {};
                            result.data.mahasantri.forEach(item => {
                                const bld = item.Gedung || "Gedung B";
                                const rm = String(item.No_Kamar || "101");
                                const key = `${bld}-${rm}`;
                                if (!roomMap[key]) {
                                    roomMap[key] = {
                                        id: `RM-${bld.replace("Gedung ", "")}${rm}`,
                                        building: bld,
                                        roomNo: rm,
                                        sector: item.Sektor || (bld === "Gedung C" ? "Putri" : "Putra"),
                                        occupants: []
                                    };
                                }
                                roomMap[key].occupants.push({
                                    id: item.ID_MHS || `MHS-${Math.floor(1000 + Math.random() * 9000)}`,
                                    nim: String(item.NIM || ""),
                                    name: item.Nama_Lengkap || item.Nama || "Mahasantri",
                                    fullName: item.Nama_Lengkap || item.Nama || "Mahasantri",
                                    major: item.Jurusan || "-",
                                    semester: item.Semester || "Semester 1",
                                    status: item.Status_Kesehatan || "Sehat",
                                    symptom: item.Keluhan_Gejala || "-"
                                });
                            });
                            setRooms(Object.values(roomMap));
                        }

                        // 2. Sync Obat (Sebat)
                        if (result.data.medicines && Array.isArray(result.data.medicines)) {
                            setMedicines(result.data.medicines.map(m => ({
                                id: m.ID_Obat || m.id,
                                name: m.Nama_Obat || m.name,
                                category: m.Kategori || m.category,
                                form: m.Bentuk_Sediaan || m.form,
                                stock: parseInt(m.Stok || m.stock, 10) || 0,
                                desc: m.Keterangan_Khasiat || m.desc || "",
                                expiryDate: m.Tanggal_Kadaluarsa || m.expiryDate || "",
                                isExpired: m.Status_Kadaluarsa === "Expired"
                            })));
                        }

                        // 3. Sync Requests
                        if (result.data.requests && Array.isArray(result.data.requests)) {
                            setRequests(result.data.requests.map(r => ({
                                id: r.ID_Order || r.id,
                                nim: String(r.NIM || r.nim),
                                name: r.Nama_Mahasantri || r.name,
                                building: r.Gedung || r.building,
                                roomNo: String(r.No_Kamar || r.roomNo),
                                sector: r.Sektor || r.sector,
                                medicineName: r.Nama_Obat || r.medicineName,
                                qty: parseInt(r.Jumlah || r.qty, 10) || 1,
                                symptom: r.Keluhan_Gejala || r.symptom,
                                date: r.Waktu_Order || r.date,
                                status: r.Status_Persetujuan || r.status || "Menunggu"
                            })));
                        }

                        // 4. Sync Petugas (Staff)
                        if (result.data.staff && Array.isArray(result.data.staff)) {
                            setStaff(result.data.staff.map(s => ({
                                id: s.ID_Petugas || s.id,
                                name: s.Nama_Petugas || s.name,
                                role: s.Role_Jabatan || s.role,
                                shift: s.Jadwal_Shift || s.shift,
                                sector: s.Sektor_Tugas || s.sector,
                                phone: s.No_Handphone || s.phone,
                                avatarBg: (s.Sektor_Tugas || s.sector) === "Putri" ? "bg-pink-600" : "bg-teal-600",
                                status: s.Status_Tugas || s.status || "Bertugas"
                            })));
                        }

                        showToast("Data berhasil disinkronkan dari Google Sheets!", "success");
                    } else {
                        showToast("Data tersambung.", "info");
                    }
                } catch (err) {
                    showToast("Sistem tersambung ke Google Apps Script.", "info");
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleNimLogin = (nim, guestName) => {
                let found = null;
                rooms.forEach(r => {
                    r.occupants.forEach(m => {
                        if (m.nim.trim().toLowerCase() === nim.trim().toLowerCase()) {
                            found = { ...m, building: r.building, roomNo: r.roomNo, sector: r.sector, fullName: m.fullName || m.name };
                        }
                    });
                });

                if (!found) {
                    found = {
                        id: `MHS-${Math.floor(1000 + Math.random() * 9000)}`,
                        nim: nim.trim(),
                        name: guestName.trim() || `Mahasantri (${nim})`,
                        fullName: guestName.trim() || `Mahasantri (${nim})`,
                        building: "Gedung B",
                        roomNo: "101",
                        sector: "Putra",
                        major: "Mahasantri Ma'had",
                        semester: "Semester 1",
                        status: "Sehat",
                        symptom: "-"
                    };
                }

                setCurrentMahasantri(found);
                setUserRole("mahasantri");
                postToSheets({ action: "registerMahasantri", ...found });
                showToast(`Selamat datang, ${found.fullName}!`, "success");
            };

            const handleRegisterMahasantri = (data) => {
                const newMhs = {
                    id: `MHS-${Math.floor(1000 + Math.random() * 9000)}`,
                    nim: data.nim,
                    name: data.fullName,
                    fullName: data.fullName,
                    major: data.major,
                    semester: data.semester,
                    status: data.status,
                    symptom: data.symptom,
                    building: data.building,
                    roomNo: data.roomNo,
                    sector: data.sector
                };

                setRooms(prevRooms => {
                    let roomExists = false;
                    const updated = prevRooms.map(r => {
                        if (r.building === data.building && r.roomNo === data.roomNo) {
                            roomExists = true;
                            return { ...r, occupants: [...r.occupants, newMhs] };
                        }
                        return r;
                    });

                    if (!roomExists) {
                        updated.push({
                            id: `RM-${data.building.replace("Gedung ", "")}${data.roomNo}`,
                            building: data.building,
                            roomNo: data.roomNo,
                            sector: data.sector,
                            occupants: [newMhs]
                        });
                    }
                    return updated;
                });

                setCurrentMahasantri(newMhs);
                setUserRole("mahasantri");
                postToSheets({ action: "registerMahasantri", ...newMhs });
                showToast("Pendaftaran berhasil! Selamat datang di Portal Mahasantri.");
            };

            const handleAdminLogin = (password) => {
                if (password === "orkes2026") {
                    setUserRole("admin");
                    showToast("Login Admin Berhasil!", "success");
                    return true;
                }
                return false;
            };

            const handleLogout = () => {
                setUserRole(null);
                setCurrentMahasantri(null);
                setCurrentView("dashboard");
                showToast("Anda telah keluar dari sistem.", "info");
            };

            const handleResetAllToHealthy = () => {
                setRooms(prev => prev.map(r => ({
                    ...r,
                    occupants: r.occupants.map(o => ({ ...o, status: "Sehat", symptom: "-" }))
                })));
                postToSheets({ action: "resetAllHealthy" });
                showToast("Seluruh status mahasantri berhasil disetel menjadi SEHAT!", "success");
            };

            const handleEditMahasantri = (mhsId, roomId, updatedMhsData, building, roomNo, sector) => {
                setRooms(prev => prev.map(r => {
                    if (r.id === roomId) {
                        return {
                            ...r,
                            occupants: r.occupants.map(o => o.id === mhsId ? { ...o, ...updatedMhsData } : o)
                        };
                    }
                    return r;
                }));
                postToSheets({ action: "registerMahasantri", ...updatedMhsData, building, roomNo, sector });
                showToast("Data mahasantri berhasil diperbarui!");
            };

            const handleDeleteMahasantri = (roomId, mhsId, mhsName) => {
                setRooms(prev => prev.map(r => {
                    if (r.id === roomId) {
                        return { ...r, occupants: r.occupants.filter(o => o.id !== mhsId) };
                    }
                    return r;
                }));
                postToSheets({ action: "deleteMahasantri", id: mhsId });
                showToast(`Mahasantri ${mhsName} berhasil dihapus.`);
            };

            const handleEditMedicine = (updatedMed) => {
                setMedicines(prev => prev.map(m => m.id === updatedMed.id ? updatedMed : m));
                postToSheets({ action: "saveMedicine", ...updatedMed });
                showToast(`Data obat ${updatedMed.name} diperbarui!`);
            };

            const handleDeleteMedicine = (medId, medName) => {
                setMedicines(prev => prev.filter(m => m.id !== medId));
                postToSheets({ action: "deleteMedicine", id: medId });
                showToast(`Obat ${medName} berhasil dihapus.`);
            };

            const handleEditRequest = (updatedReq) => {
                setRequests(prev => prev.map(r => r.id === updatedReq.id ? updatedReq : r));
                postToSheets({ action: "updateRequestStatus", id: updatedReq.id, status: updatedReq.status });
                showToast(`Permintaan ${updatedReq.id} diperbarui.`);
            };

            const handleDeleteRequest = (reqId) => {
                setRequests(prev => prev.filter(r => r.id !== reqId));
                postToSheets({ action: "deleteRequest", id: reqId });
                showToast(`Permintaan ${reqId} berhasil dihapus.`);
            };

            const handleEditStaff = (updatedStaff) => {
                setStaff(prev => prev.map(s => s.id === updatedStaff.id ? updatedStaff : s));
                postToSheets({ action: "saveStaff", ...updatedStaff });
                showToast(`Data petugas ${updatedStaff.name} diperbarui.`);
            };

            const handleDeleteStaff = (staffId, staffName) => {
                setStaff(prev => prev.filter(s => s.id !== staffId));
                postToSheets({ action: "deleteStaff", id: staffId });
                showToast(`Petugas ${staffName} berhasil dihapus.`);
            };

            const handleRequestMedicine = (medName, qty, symptom) => {
                if (!currentMahasantri) return;
                const newReq = {
                    id: `REQ-${Math.floor(100 + Math.random() * 900)}`,
                    nim: currentMahasantri.nim,
                    name: currentMahasantri.fullName || currentMahasantri.name,
                    building: currentMahasantri.building,
                    roomNo: currentMahasantri.roomNo,
                    sector: currentMahasantri.sector,
                    medicineName: medName,
                    qty: parseInt(qty, 10) || 1,
                    symptom: symptom || "Keluhan kesehatan mahasantri",
                    date: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    status: "Menunggu"
                };
                setRequests([newReq, ...requests]);
                showToast(`Permintaan obat ${medName} terkirim ke Admin & Sheets!`, "success");
                postToSheets({ action: "hitOrderMedicine", ...newReq });
            };

            const handleUpdateRequestStatus = (reqId, newStatus) => {
                const reqItem = requests.find(r => r.id === reqId);
                if (newStatus === "Disetujui" && reqItem) {
                    setMedicines(prevMeds => prevMeds.map(m => {
                        if (m.name.toLowerCase() === reqItem.medicineName.toLowerCase() && m.stock >= reqItem.qty) {
                            return { ...m, stock: m.stock - reqItem.qty };
                        }
                        return m;
                    }));
                }
                setRequests(prev => prev.map(r => r.id === reqId ? { ...r, status: newStatus } : r));
                postToSheets({ action: "updateRequestStatus", id: reqId, status: newStatus });
                showToast(`Status permintaan ${reqId} diperbarui menjadi ${newStatus}`);
            };

            if (!userRole) {
                return <AuthContainer 
                            onNimLogin={handleNimLogin}
                            onRegisterMahasantri={handleRegisterMahasantri} 
                            onAdminLogin={handleAdminLogin} 
                            isDarkMode={isDarkMode} 
                            toggleDarkMode={toggleDarkMode} 
                       />;
            }

            if (userRole === "mahasantri") {
                return (
                    <UserPortalLayout 
                        mahasantri={currentMahasantri} 
                        medicines={medicines} 
                        staff={staff} 
                        requests={requests.filter(r => r.nim === currentMahasantri.nim)} 
                        onRequestMedicine={handleRequestMedicine}
                        onLogout={handleLogout}
                        isDarkMode={isDarkMode}
                        toggleDarkMode={toggleDarkMode}
                        toast={toast}
                    />
                );
            }

            return (
                <div className={`min-h-screen flex flex-col pb-20 md:pb-0 transition-colors duration-200 ${isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                    {}
                    <header className={`sticky top-0 z-30 shadow-sm border-b transition-colors duration-200 ${isDarkMode ? 'bg-slate-800/95 border-slate-700 backdrop-blur-md' : 'bg-white/95 border-slate-200 backdrop-blur-md'}`}>
                        <div className="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex justify-between items-center">
                            <div className="flex items-center gap-2.5 sm:gap-3">
                                <button 
                                    onClick={() => setIsDrawerOpen(true)}
                                    className={`w-10 h-10 rounded-xl flex items-center justify-center transition active:scale-95 ${isDarkMode ? 'text-slate-300 hover:bg-slate-700 bg-slate-800' : 'text-slate-600 hover:bg-slate-100 bg-slate-50'}`}
                                    aria-label="Buka Menu Sidebar"
                                    title="Menu">
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white shadow-sm font-bold text-sm">
                                        <i className="fa-solid fa-user-gear"></i>
                                    </div>
                                    <div className="leading-tight">
                                        <div className="flex items-center gap-1.5">
                                            <h1 className="font-bold text-sm sm:text-base">Ritma Care</h1>
                                            <span className="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-teal-500/20 text-teal-500 border border-teal-500/30">ADMIN</span>
                                        </div>
                                        <p className="text-[10px] sm:text-[11px] text-teal-600 dark:text-teal-400 font-semibold truncate max-w-[170px] xs:max-w-none">Gedung B, C & D (2026/2027)</p>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 sm:gap-2.5">
                                <button 
                                    onClick={() => syncWithGoogleSheets()}
                                    disabled={isSyncing}
                                    className="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 hover:bg-emerald-500/20 active:scale-95"
                                    title="Klik untuk menyinkronkan data dengan Google Sheets">
                                    <i className={`fa-solid fa-rotate ${isSyncing ? 'fa-spin' : ''}`}></i>
                                    <span>Sinkron Database</span>
                                </button>

                                {requests.filter(r => r.status === 'Menunggu').length > 0 && (
                                    <button 
                                        onClick={() => setCurrentView("requests")}
                                        className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-500 border border-amber-500/40 animate-pulse">
                                        <i className="fa-solid fa-bell text-xs"></i>
                                        <span className="hidden xs:inline">{requests.filter(r => r.status === 'Menunggu').length}</span>
                                    </button>
                                )}
                                
                                <button
                                    onClick={toggleDarkMode}
                                    className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm border transition-all active:scale-95 ${isDarkMode ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-amber-50 text-amber-600 border-amber-200'}`}
                                    aria-label="Toggle Mode Gelap">
                                    <i className={`fa-solid ${isDarkMode ? 'fa-sun text-amber-300' : 'fa-moon text-slate-700'}`}></i>
                                </button>

                                <button 
                                    onClick={handleLogout}
                                    className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500/20 text-xs font-bold transition flex items-center gap-1.5 active:scale-95"
                                    title="Keluar">
                                    <i className="fa-solid fa-power-off"></i>
                                    <span className="hidden sm:inline">Keluar</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {}
                    {isDrawerOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            <div 
                                className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm transition-opacity" 
                                onClick={() => setIsDrawerOpen(false)}></div>

                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setShowAddModal(false)}></div>
                            <div className={`relative w-full max-w-md p-6 rounded-3xl shadow-2xl z-10 space-y-4 ${isDarkMode ? 'bg-slate-800 text-slate-100 border border-slate-700' : 'bg-white text-slate-800'}`}>
                                <div className="flex justify-between items-center border-b pb-3 dark:border-slate-700">
                                    <h3 className="font-bold text-base">Tambah Petugas ORKES</h3>
                                    <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-200">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleAddStaffSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Nama Lengkap *</label>
                                        <input 
                                            type="text" 
                                            value={name} 
                                            onChange={(e) => setName(e.target.value)} 
                                            placeholder="Ahmad Zaenuri" 
                                            className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            required 
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Jabatan / Role</label>
                                            <input 
                                                type="text" 
                                                value={role} 
                                                onChange={(e) => setRole(e.target.value)} 
                                                placeholder="Anggota Cekmar" 
                                                className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            />
                                        </div>
                                        <div>
                                            <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Sektor</label>
                                            <select 
                                                value={sector} 
                                                onChange={(e) => setSector(e.target.value)}
                                                className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}>
                                                <option value="Putra">Sektor Putra</option>
                                                <option value="Putri">Sektor Putri</option>
                                                <option value="Semua">Semua Sektor</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Jadwal Shift</label>
                                            <input 
                                                type="text" 
                                                value={shift} 
                                                onChange={(e) => setShift(e.target.value)} 
                                                placeholder="Shift Pagi / Malam" 
                                                className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            />
                                        </div>
                                        <div>
                                            <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>No. HP / WA</label>
                                            <input 
                                                type="text" 
                                                value={phone} 
                                                onChange={(e) => setPhone(e.target.value)} 
                                                placeholder="0812-..." 
                                                className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            />
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowAddModal(false)} className={`flex-1 py-2.5 font-bold rounded-xl text-xs transition border active:scale-95 ${isDarkMode ? 'bg-slate-700 hover:bg-slate-600 text-slate-200 border-slate-600' : 'bg-slate-200 hover:bg-slate-300 text-slate-700 border-slate-300'}`}>Batal</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow active:scale-95">Simpan Petugas</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {editingStaff && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setEditingStaff(null)}></div>
                            <div className={`relative w-full max-w-md p-6 rounded-3xl shadow-2xl z-10 space-y-4 ${isDarkMode ? 'bg-slate-800 text-slate-100 border border-slate-700' : 'bg-white text-slate-800'}`}>
                                <div className="flex justify-between items-center border-b pb-3 dark:border-slate-700">
                                    <h3 className="font-bold text-base">Edit Data Petugas</h3>
                                    <button onClick={() => setEditingStaff(null)} className="text-slate-400 hover:text-slate-200">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    onEditStaff(editingStaff);
                                    setEditingStaff(null);
                                }} className="space-y-3 text-xs">
                                    <div>
                                        <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Nama Lengkap</label>
                                        <input 
                                            type="text" 
                                            value={editingStaff.name} 
                                            onChange={(e) => setEditingStaff({ ...editingStaff, name: e.target.value })} 
                                            className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            required 
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Role / Jabatan</label>
                                            <input 
                                                type="text" 
                                                value={editingStaff.role} 
                                                onChange={(e) => setEditingStaff({ ...editingStaff, role: e.target.value })} 
                                                className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            />
                                        </div>
                                        <div>
                                            <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Shift</label>
                                            <input 
                                                type="text" 
                                                value={editingStaff.shift} 
                                                onChange={(e) => setEditingStaff({ ...editingStaff, shift: e.target.value })} 
                                                className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Sektor</label>
                                            <select 
                                                value={editingStaff.sector} 
                                                onChange={(e) => setEditingStaff({ ...editingStaff, sector: e.target.value })}
                                                className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}>
                                                <option value="Putra">Putra</option>
                                                <option value="Putri">Putri</option>
                                                <option value="Semua">Semua</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>Status Tugas</label>
                                            <select 
                                                value={editingStaff.status} 
                                                onChange={(e) => setEditingStaff({ ...editingStaff, status: e.target.value })}
                                                className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}>
                                                <option value="Bertugas">Bertugas</option>
                                                <option value="Off / Libur">Off / Libur</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className={`font-bold uppercase ${isDarkMode ? 'text-slate-300' : 'text-slate-400'}`}>No. Telepon</label>
                                        <input 
                                            type="text" 
                                            value={editingStaff.phone} 
                                            onChange={(e) => setEditingStaff({ ...editingStaff, phone: e.target.value })} 
                                            className={`w-full p-2.5 border rounded-xl font-bold mt-1 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                        />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setEditingStaff(null)} className={`flex-1 py-2.5 font-bold rounded-xl text-xs transition border active:scale-95 ${isDarkMode ? 'bg-slate-700 hover:bg-slate-600 text-slate-200 border-slate-600' : 'bg-slate-200 hover:bg-slate-300 text-slate-700 border-slate-300'}`}>Batal</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow active:scale-95">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
